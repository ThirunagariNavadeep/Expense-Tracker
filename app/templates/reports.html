<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTrack | Reports</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-page="reports">
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">ExpenseTrack</div>
            <nav class="nav">
                <a href="/dashboard">Dashboard</a>
                <a href="/transactions">Transactions</a>
                <a href="/budgets">Budgets</a>
                <a class="active" href="/reports">Reports</a>
                <a href="/profile">Profile</a>
            </nav>
        </aside>
        <main class="content">
            <header class="topbar">
                <div>
                    <h1>Reports & Insights</h1>
                </div>
                <button id="logout-button" class="secondary-button">Logout</button>
            </header>

            <section class="summary-cards">
                <article class="card summary-card accent-blue">
                    <span>Income</span>
                    <strong id="report-income">$0.00</strong>
                </article>
                <article class="card summary-card accent-red">
                    <span>Expenses</span>
                    <strong id="report-expense">$0.00</strong>
                </article>
                <article class="card summary-card accent-green">
                    <span>Balance</span>
                    <strong id="report-balance">$0.00</strong>
                </article>
            </section>

            <section class="card panel">
                <h2>Category Wise Spend</h2>
                <div id="report-category-breakdown" class="list-stack"></div>
            </section>
        </main>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
